name: Full CI with Coverage

on: [push, pull_request]

jobs:
  lint_and_test:
    name: Lint & Test (host)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Format check (black)
      run: black .

    # - name: Lint (flake8)
    #   run: flake8 .

    - name: Run unit tests (host)
      run: |
        export PYTHONPATH=$(pwd)/cafe_order_system
        python manage.py test orders  # Запуск юнит-тестов Django

    - name: Run tests with coverage (host)
      env:
        DATABASE_URL: "sqlite+aiosqlite:///./db.sqlite3"
      run: |
        pytest --cov=app --cov-report=term-missing --cov-fail-under=0

  docker_build_and_test:
    name: Docker Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Copy .env file to Docker context
      run: cp .env .env

    - name: Build Docker image
      run: docker build -t cafe_test .

    - name: Run unit tests inside Docker
      run: docker run --rm -e DATABASE_URL="sqlite+aiosqlite:///./db.sqlite3" cafe_test pytest tests/unit --maxfail=1 --disable-warnings -q  # Запуск юнит-тестов внутри Docker

    - name: Run tests with coverage inside container
      run: docker run --rm -e DATABASE_URL="sqlite+aiosqlite:///./db.sqlite3" cafe_test pytest --cov=app --cov-report=term-missing --cov-fail-under=0
